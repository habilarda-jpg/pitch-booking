[project]
name = "pitch-booking"
version = "0.1.0"
description = "Football pitch (halı saha) reservation system - Software Design & Architecture course project"
readme = "README.md"
authors = [
    { name = "Habil Arda Koyunlu", email = "koyunluhabilarda@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
